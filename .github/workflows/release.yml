name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-apple:
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust Apple archives
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-tvos aarch64-apple-tvos-sim
          bash rust/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rust-apple
          path: rust/artifacts/ios/
          if-no-files-found: error

  rust-android:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@v4
      - name: Test Rust and build Android archives
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo test --manifest-path rust/Cargo.toml --locked
          sdkmanager --install 'ndk;27.1.12297006'
          sh rust/build-android.sh "$ANDROID_HOME/ndk/27.1.12297006"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-android
          path: rust/artifacts/android/
          if-no-files-found: error

  release:
    name: Release
    needs: [rust-apple, rust-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          name: rust-apple
          path: rust/artifacts/ios/
      - uses: actions/download-artifact@v8
        with:
          name: rust-android
          path: rust/artifacts/android/
      - name: Verify Rust artifacts
        run: node rust/verify-artifacts.cjs
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Build lib
        run: bun run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: '${{ github.actor }}@users.noreply.github.com'
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: '${{ github.actor }}@users.noreply.github.com'
        run: bun release
