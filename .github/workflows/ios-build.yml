name: Build iOS

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-build.yml'
      - 'example/ios/**'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'cpp/**'
      - 'ios/**'
      - 'rust/**'
      - '**/Podfile.lock'
      - '**/bun.lock'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'example/ios/**'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'cpp/**'
      - 'ios/**'
      - 'rust/**'
      - '**/Podfile.lock'
      - '**/bun.lock'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  workflow_dispatch:

env:
  USE_CCACHE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Example App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.4

      - name: Install dependencies (bun)
        run: bun install

      - name: Install example dependencies (bun)
        working-directory: example
        run: bun install

      - name: Generate Nitro bindings
        run: bun run codegen

      - name: Build Rust XCFramework
        env:
          RUSTUP_TOOLCHAIN: 1.100.0
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools \
            --target aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-tvos,aarch64-apple-tvos-sim
          bash rust/build-ios.sh

      - name: Check the Swift and Rust archive bridge
        env:
          RUSTUP_TOOLCHAIN: 1.100.0
        run: |
          cargo build --locked --release --lib --manifest-path rust/Cargo.toml
          swiftc -import-objc-header rust/include/nitro_archive_core.h \
            ios/Domain/{ArchiveError,ProgressSnapshot}.swift \
            ios/Application/Ports/Archive{Engine,Input,Output}.swift \
            ios/Application/OpenArchiveUseCase.swift \
            ios/Infrastructure/Memory/BufferArchiveInput.swift \
            ios/Infrastructure/Storage/LocalFileInput.swift \
            ios/Infrastructure/Zip/RustZipArchive.swift \
            tests/native/RustZipInspectionChecks.swift \
            rust/target/release/libnitro_archive_core.a \
            -framework Security -o "$RUNNER_TEMP/rust-zip-checks"
          "$RUNNER_TEMP/rust-zip-checks"

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        working-directory: example/ios
        run: bundle exec pod install

      - name: Build App
        working-directory: example/ios
        run: |
          set -o pipefail
          for configuration in Debug Release; do
            xcodebuild \
              -derivedDataPath build \
              -workspace NitroArchiveExample.xcworkspace \
              -scheme NitroArchiveExample \
              -sdk iphonesimulator \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO build | xcpretty
          done
