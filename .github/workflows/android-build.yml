name: Build Android

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'
      - 'example/android/**'
      - 'nitrogen/generated/shared/**'
      - 'nitrogen/generated/android/**'
      - 'cpp/**'
      - 'android/**'
      - 'rust/**'
      - 'src/specs/**'
      - 'package.json'
      - '**/bun.lock'
      - '**/yarn.lock'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'example/android/**'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/android/**'
      - 'cpp/**'
      - 'android/**'
      - 'rust/**'
      - 'src/specs/**'
      - 'package.json'
      - '**/bun.lock'
      - '**/yarn.lock'
      - '**/react-native.config.js'
      - '**/nitro.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Example App
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        run: bun install

      - name: Install example dependencies (bun)
        working-directory: example
        run: bun install

      - name: Generate Nitro bindings
        run: bun run codegen

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build Rust Android archives
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup target add --toolchain 1.100.0 aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          sdkmanager --install 'ndk;27.1.12297006' 'platforms;android-37' 'build-tools;37.0.0'
          RUSTUP_TOOLCHAIN=1.100.0 sh rust/build-android.sh "$ANDROID_HOME/ndk/27.1.12297006"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*', 'example/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build
        working-directory: example/android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --build-cache

      - name: Verify release APK alignment
        run: '"$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 example/android/app/build/outputs/apk/release/app-release.apk'

      - name: Stop Gradle daemon
        working-directory: example/android
        run: ./gradlew --stop
