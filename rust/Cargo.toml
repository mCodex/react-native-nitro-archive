[package]
name = "nitro-archive-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=9.8.1", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }

[lib]
crate-type = ["rlib", "staticlib"]
