[package]
name = "nitro-archive-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "=0.2.191"
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
rustix = { version = "=1.1.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "=0.4.46", default-features = false }
time = { version = "=0.3.55", default-features = false }
zip = { version = "=9.8.1", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs", "time"] }

[lib]
crate-type = ["rlib", "staticlib"]

[dev-dependencies]
tempfile = "=3.27.0"
